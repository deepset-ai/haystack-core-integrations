# This workflow comes from https://github.com/ofek/hatch-mypyc
# https://github.com/ofek/hatch-mypyc/blob/5a198c0ba8660494d02716cfc9d79ce4adfb1442/.github/workflows/test.yml
name: Test / alloydb

on:
  schedule:
    - cron: "0 0 * * *"
  pull_request:
    paths:
      - "integrations/alloydb/**"
      - "!integrations/alloydb/*.md"
      - "integrations/pgvector/src/**"
      - ".github/workflows/alloydb.yml"
  push:
    branches:
      - main
    paths:
      - "integrations/alloydb/**"
      - "!integrations/alloydb/*.md"
      - "integrations/pgvector/src/**"
      - ".github/workflows/alloydb.yml"

defaults:
  run:
    working-directory: integrations/alloydb

concurrency:
  group: alloydb-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"
  TEST_MATRIX_OS: '["ubuntu-latest", "windows-latest", "macos-latest"]'
  TEST_MATRIX_PYTHON: '["3.11", "3.15"]'

jobs:
  compute-test-matrix:
    runs-on: ubuntu-slim
    defaults:
      run:
        working-directory: .
    outputs:
      os: ${{ steps.set.outputs.os }}
      python-version: ${{ steps.set.outputs.python-version }}
    steps:
      - id: set
        run: |
          echo 'os=${{ github.event_name == 'push' && '["ubuntu-latest"]' || env.TEST_MATRIX_OS }}' >> "$GITHUB_OUTPUT"
          echo 'python-version=${{ github.event_name == 'push' && '["3.11"]' || env.TEST_MATRIX_PYTHON }}' >> "$GITHUB_OUTPUT"

  run:
    name: Python ${{ matrix.python-version }} on ${{ startsWith(matrix.os, 'macos-') && 'macOS' || startsWith(matrix.os, 'windows-') && 'Windows' || 'Linux' }}
    needs: compute-test-matrix
    permissions:
      contents: write
      pull-requests: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: ${{ fromJSON(needs.compute-test-matrix.outputs.os) }}
        python-version: ${{ fromJSON(needs.compute-test-matrix.outputs.python-version) }}

    steps:
      - name: Support longpaths
        if: matrix.os == 'windows-latest'
        working-directory: .
        run: git config --system core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # tags are needed to compute the version of the local pgvector-haystack package
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Hatch
        run: pip install --upgrade hatch

      - name: Lint
        if: matrix.python-version == '3.11' && runner.os == 'Linux'
        run: hatch run fmt-check && hatch run test:types

      - name: Run unit tests
        run: hatch run test:unit-cov-retry

      # On PR: posts coverage comment (directly on same-repo PRs; via artifact for fork PRs). On push to main: stores coverage baseline on data branch.
      - name: Store unit tests coverage
        id: coverage_comment
        if: matrix.python-version == '3.11' && runner.os == 'Linux' && github.event_name != 'schedule'
        uses: py-cov-action/python-coverage-comment-action@e5fb2218463c3377f3504b0c5b5646ed53da7a2f # v4.5
        with:
          GITHUB_TOKEN: ${{ github.token }}
          COVERAGE_PATH: integrations/alloydb
          SUBPROJECT_ID: alloydb
          MINIMUM_GREEN: 90
          MINIMUM_ORANGE: 60

      - name: Upload coverage comment to be posted
        if: matrix.python-version == '3.11' && runner.os == 'Linux' && github.event_name == 'pull_request' && steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-comment-alloydb
          path: python-coverage-comment-action-alloydb.txt

      # We are not running this against a real AlloyDB instance here.
      # AlloyDB is PostgreSQL-compatible: the integration tests run against a plain PostgreSQL with pgvector,
      # with the AlloyDB Python Connector replaced by a direct connection (see tests/conftest.py).
      # Containers only run on Linux runners.
      - name: Start PostgreSQL with pgvector
        if: runner.os == 'Linux'
        run: |
          docker run -d --name pgvector -p 5432:5432 \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=postgres \
            pgvector/pgvector:pg17
          for i in $(seq 1 30); do
            if docker exec pgvector pg_isready -U postgres; then
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

      - name: Run integration tests against PostgreSQL
        if: runner.os == 'Linux'
        env:
          PG_CONN_STR: "postgresql://postgres:postgres@localhost:5432/postgres"
        run: hatch run test:integration-cov-append-retry

      - name: Run integration tests
        if: env.ALLOYDB_INSTANCE_URI != ''
        env:
          ALLOYDB_INSTANCE_URI: ${{ secrets.ALLOYDB_INSTANCE_URI }}
          ALLOYDB_USER: ${{ secrets.ALLOYDB_USER }}
          ALLOYDB_PASSWORD: ${{ secrets.ALLOYDB_PASSWORD }}
        run: hatch run test:integration-cov-append-retry

      - name: Store combined coverage
        if: github.event_name == 'push' && runner.os == 'Linux'
        uses: py-cov-action/python-coverage-comment-action@e5fb2218463c3377f3504b0c5b5646ed53da7a2f # v4.5
        with:
          GITHUB_TOKEN: ${{ github.token }}
          COVERAGE_PATH: integrations/alloydb
          SUBPROJECT_ID: alloydb-combined
          MINIMUM_GREEN: 90
          MINIMUM_ORANGE: 60

      # AlloyDBDocumentStore extends PgvectorDocumentStore: repeat the tests against the local
      # pgvector source so that changes to pgvector that break AlloyDB are caught before a pgvector release
      - name: Test with pgvector from local source
        if: runner.os == 'Linux'
        env:
          PG_CONN_STR: "postgresql://postgres:postgres@localhost:5432/postgres"
        run: |
          hatch env prune
          hatch -e test env run -- uv pip install ../pgvector
          hatch run test:all

      - name: Run unit tests with lowest direct dependencies
        if: github.event_name != 'push'
        run: |
          hatch run uv pip compile pyproject.toml --resolution lowest-direct --output-file requirements_lowest_direct.txt
          hatch -e test env run -- uv pip install -r requirements_lowest_direct.txt
          hatch run test:unit

      - name: Nightly - run unit tests with Haystack main branch
        if: github.event_name == 'schedule'
        run: |
          hatch env prune
          hatch -e test env run -- uv pip install git+https://github.com/deepset-ai/haystack.git@main
          hatch run test:unit

  notify-slack-on-failure:
    needs: run
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-slim
    steps:
      - uses: deepset-ai/notify-slack-action@a65def0c8bf91d6520286ab34280151c76a5a008 # v1.1.0
        with:
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL_NOTIFICATIONS }}
