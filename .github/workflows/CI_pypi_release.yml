name: Core / Project release on PyPi

# The pushed tag must be formatted like so:
# * integrations/<INTEGRATION_FOLDER_NAME>-v1.0.0
# * integrations/<INTEGRATION_FOLDER_NAME>-v1.0.0.post0 (for post-releases)
#
# For example, if we want to release version 1.0.99
# of the google-vertex-haystack integration we'd have to push the tag:
#
# integrations/google_vertex-v1.0.99
#
# For a final post-release (e.g., for archiving):
#
# integrations/google_vertex-v1.0.99.post0

on:
  push:
    tags:
      - "**-v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  release-on-pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.HAYSTACK_BOT_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatch requests --uploaded-prior-to=P1D

      - name: Validate version number
        env:
          REF_NAME: ${{ github.ref_name }}
        run: python .github/utils/validate_version.py --tag "$REF_NAME"

      - name: Get project folder
        id: pathfinder
        shell: python
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          import os
          project_path = os.environ["REF_NAME"].rsplit("-", maxsplit=1)[0]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            print(f'project_path={project_path}', file=f)

      - name: Build extra
        working-directory: ${{ steps.pathfinder.outputs.project_path }}
        run: hatch build

      - name: Publish on PyPi
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: ${{ steps.pathfinder.outputs.project_path }}/dist

      # git-cliff does not properly support a release use case that is common for us: tag the latest commit in main
      # to release an integration that has been touched in a previous commit. (https://github.com/orhun/git-cliff/issues/1122)
      # What does it happen?
      # - at release time, the changelog appears with an [unreleased] section
      # - at the next release, the commits appearing in the previous release are incorrectly attributed to the following
      #   version
      # For this reason, we:
      # - pass --tag to name the current release
      # - only generate changelog for the current release and prepend to the existing changelog
      - name: Prepare git-cliff arguments
        id: cliffargs
        env:
          REF_NAME: ${{ github.ref_name }}
          PROJECT_PATH: ${{ steps.pathfinder.outputs.project_path }}
        run: |
          set -euo pipefail
          # nearest release tag that is an ancestor of the one we're releasing; empty on first release
          PREV_TAG=$(git describe --tags --abbrev=0 --match "${PROJECT_PATH}-v*" "${REF_NAME}^" 2>/dev/null || true)
          ARGS="--include-path \"${PROJECT_PATH}/**/*\" --tag-pattern \"^${PROJECT_PATH}-v\" --tag \"${REF_NAME}\""
          if [ -n "${PREV_TAG}" ] && [ -f "${PROJECT_PATH}/CHANGELOG.md" ]; then
            ARGS="${ARGS} --prepend \"${PROJECT_PATH}/CHANGELOG.md\" \"${PREV_TAG}..HEAD\""
          else
            # first release: nothing to preserve, generate the whole file
            ARGS="${ARGS} --output \"${PROJECT_PATH}/CHANGELOG.md\""
          fi
          echo "args=${ARGS}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2 # v4.9.0
        with:
          config: cliff.toml
          args: ${{ steps.cliffargs.outputs.args }}

      - name: Commit changelog
        uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
        with:
          author_name: "HaystackBot"
          author_email: "accounts@deepset.ai"
          message: "Update the changelog"
          add: ${{ steps.pathfinder.outputs.project_path }}
          # to avoid that the pushed branch tip is behind its remote counterpart, we need to pull first
          pull: "origin main --rebase --autostash"
          push: origin HEAD:main
