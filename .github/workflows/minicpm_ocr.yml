# This workflow comes from https://github.com/ofek/hatch-mypyc
# https://github.com/ofek/hatch-mypyc/blob/5a198c0ba8660494d02716cfc9d79ce4adfb1442/.github/workflows/test.yml
name: Test / minicpm_ocr

on:
  schedule:
    - cron: "0 0 * * *"
  pull_request:
    paths:
      - "integrations/minicpm_ocr/**"
      - "!integrations/minicpm_ocr/*.md"
      - ".github/workflows/minicpm_ocr.yml"
  push:
    branches:
      - main
    paths:
      - "integrations/minicpm_ocr/**"
      - "!integrations/minicpm_ocr/*.md"
      - ".github/workflows/minicpm_ocr.yml"

defaults:
  run:
    working-directory: integrations/minicpm_ocr

concurrency:
  group: minicpm_ocr-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"
  TEST_MATRIX_OS: '["ubuntu-latest", "windows-latest", "macos-latest"]'
  TEST_MATRIX_PYTHON: '["3.11", "3.12"]'
  LLAMA_CPP_VERSION: "b12110"
  GGUF_REVISION: "0133ad8db635210441a55dcf421e25bfb9915142"
  LAYOUT_REVISION: "241f8bdfc77a7c7bee915a5057aaee58c235a8d3"
  MODELS_DIR: /home/runner/.cache/minicpm-ocr-ci

jobs:
  compute-test-matrix:
    runs-on: ubuntu-slim
    defaults:
      run:
        working-directory: .
    outputs:
      os: ${{ steps.set.outputs.os }}
      python-version: ${{ steps.set.outputs.python-version }}
    steps:
      - id: set
        run: |
          echo 'os=${{ github.event_name == 'push' && '["ubuntu-latest"]' || env.TEST_MATRIX_OS }}' >> "$GITHUB_OUTPUT"
          echo 'python-version=${{ github.event_name == 'push' && '["3.11"]' || env.TEST_MATRIX_PYTHON }}' >> "$GITHUB_OUTPUT"

  run:
    name: Python ${{ matrix.python-version }} on ${{ startsWith(matrix.os, 'macos-') && 'macOS' || startsWith(matrix.os, 'windows-') && 'Windows' || 'Linux' }}
    needs: compute-test-matrix
    permissions:
      contents: write
      pull-requests: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.compute-test-matrix.outputs.os) }}
        python-version: ${{ fromJSON(needs.compute-test-matrix.outputs.python-version) }}

    steps:
      - name: Support longpaths
        if: matrix.os == 'windows-latest'
        working-directory: .
        run: git config --system core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Hatch
        run: |
          python -m pip install --upgrade pip
          pip install hatch --uploaded-prior-to=P1D
      - name: Lint
        if: matrix.python-version == '3.11' && runner.os == 'Linux'
        run: hatch run fmt-check && hatch run test:types

      - name: Run unit tests
        run: hatch run test:unit-cov-retry

      # On PR: posts coverage comment (directly on same-repo PRs; via artifact for fork PRs). On push to main: stores coverage baseline on data branch.
      - name: Store unit tests coverage
        id: coverage_comment
        if: matrix.python-version == '3.11' && runner.os == 'Linux' && github.event_name != 'schedule'
        uses: py-cov-action/python-coverage-comment-action@e5fb2218463c3377f3504b0c5b5646ed53da7a2f # v4.5
        with:
          GITHUB_TOKEN: ${{ github.token }}
          COVERAGE_PATH: integrations/minicpm_ocr
          SUBPROJECT_ID: minicpm_ocr
          MINIMUM_GREEN: 90
          MINIMUM_ORANGE: 60

      - name: Upload coverage comment to be posted
        if: matrix.python-version == '3.11' && runner.os == 'Linux' && github.event_name == 'pull_request' && steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-comment-minicpm_ocr
          path: python-coverage-comment-action-minicpm_ocr.txt

      # Integration tests run against a local CPU llama.cpp server, only on Linux with the minimum Python version.
      # Models are pinned to Hugging Face revisions and cached; the layout model comes from Hugging Face because
      # the SDK's default download source is unreliable from GitHub runners.
      - name: Cache MiniCPM-OCR models and llama.cpp
        if: matrix.python-version == '3.11' && runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.MODELS_DIR }}
          key: minicpm-ocr-${{ env.LLAMA_CPP_VERSION }}-${{ env.GGUF_REVISION }}-${{ env.LAYOUT_REVISION }}

      - name: Download llama.cpp and models
        if: matrix.python-version == '3.11' && runner.os == 'Linux'
        working-directory: .
        run: |
          set -euo pipefail
          # The prebuilt llama.cpp CPU binaries link against OpenMP
          dpkg -s libgomp1 > /dev/null 2>&1 || sudo apt-get install -y libgomp1
          download() { [ -s "$2" ] || curl -fsSL --retry 5 --retry-all-errors -o "$2" "$1"; }
          mkdir -p "$MODELS_DIR/layout"
          if [ ! -x "$MODELS_DIR/llama-$LLAMA_CPP_VERSION/llama-server" ]; then
            download "https://github.com/ggml-org/llama.cpp/releases/download/$LLAMA_CPP_VERSION/llama-$LLAMA_CPP_VERSION-bin-ubuntu-x64.tar.gz" "$RUNNER_TEMP/llama.tar.gz"
            tar -xzf "$RUNNER_TEMP/llama.tar.gz" -C "$MODELS_DIR"
          fi
          gguf="https://huggingface.co/openbmb/MiniCPM-OCR-1.0-gguf/resolve/$GGUF_REVISION"
          download "$gguf/MiniCPM-OCR-1_0-Q4_K_M.gguf" "$MODELS_DIR/MiniCPM-OCR-1_0-Q4_K_M.gguf"
          download "$gguf/mmproj-model-f16-4x.gguf" "$MODELS_DIR/mmproj-model-f16-4x.gguf"
          for f in inference.yml inference.json inference.pdiparams; do
            download "https://huggingface.co/PaddlePaddle/PP-DocLayoutV3/resolve/$LAYOUT_REVISION/$f" "$MODELS_DIR/layout/$f"
          done

      - name: Start llama.cpp server
        if: matrix.python-version == '3.11' && runner.os == 'Linux'
        working-directory: .
        run: |
          nohup "$MODELS_DIR/llama-$LLAMA_CPP_VERSION/llama-server" \
            -m "$MODELS_DIR/MiniCPM-OCR-1_0-Q4_K_M.gguf" \
            --mmproj "$MODELS_DIR/mmproj-model-f16-4x.gguf" \
            --host 127.0.0.1 --port 8080 > "$RUNNER_TEMP/llama-server.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/health > /dev/null && { echo "llama.cpp server is ready."; exit 0; }
            sleep 5
          done
          echo "Timed out waiting for the llama.cpp server."
          cat "$RUNNER_TEMP/llama-server.log"
          exit 1

      - name: Run integration tests
        if: matrix.python-version == '3.11' && runner.os == 'Linux'
        env:
          MINICPM_OCR_SERVER_URL: http://127.0.0.1:8080
          MINICPM_OCR_BACKEND: llamacpp
          MINICPM_OCR_LAYOUT_MODEL_DIR: ${{ env.MODELS_DIR }}/layout
        run: hatch run test:integration-cov-append-retry

      - name: Show llama.cpp server log
        if: failure() && matrix.python-version == '3.11' && runner.os == 'Linux'
        working-directory: .
        run: tail -n 200 "$RUNNER_TEMP/llama-server.log" || true

      - name: Store combined coverage
        if: github.event_name == 'push'
        uses: py-cov-action/python-coverage-comment-action@e5fb2218463c3377f3504b0c5b5646ed53da7a2f # v4.5
        with:
          GITHUB_TOKEN: ${{ github.token }}
          COVERAGE_PATH: integrations/minicpm_ocr
          SUBPROJECT_ID: minicpm_ocr-combined
          MINIMUM_GREEN: 90
          MINIMUM_ORANGE: 60

      - name: Run unit tests with lowest direct dependencies
        if: github.event_name != 'push'
        run: |
          hatch run uv pip compile pyproject.toml --resolution lowest-direct --output-file requirements_lowest_direct.txt
          hatch -e test env run -- uv pip install -r requirements_lowest_direct.txt
          hatch run test:unit

      - name: Nightly - run unit tests with Haystack main branch
        if: github.event_name == 'schedule'
        run: |
          hatch env prune
          hatch -e test env run -- uv pip install git+https://github.com/deepset-ai/haystack.git@main
          hatch run test:unit

  notify-slack-on-failure:
    needs: run
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-slim
    steps:
      - uses: deepset-ai/notify-slack-action@a65def0c8bf91d6520286ab34280151c76a5a008 # v1.1.0
        with:
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL_NOTIFICATIONS }}
