# An ephemeral Otari gateway for the integration tests, storing its data in SQLite inside the container
services:
  otari:
    image: mzdotai/otari:0.24.0
    command: otari serve
    ports:
      - "8000:8000"
    restart: "no"
    environment:
      # passed through from the shell when set, so that commands like `docker compose down` work without them
      OTARI_API_KEY:
      OPENAI_API_KEY:
      COHERE_API_KEY:
      # $${...} reaches Otari unexpanded, so Otari reads the keys from its environment
      OTARI_CONFIG_YAML: |
        default_pricing: true
        # Provider copies of attached files need OTARI_PROVIDER_ACCOUNT_PEPPER; the tests attach no files
        files_provider_upload_enabled: false
        providers:
          openai:
            api_key: $${OPENAI_API_KEY}
          cohere:
            api_key: $${COHERE_API_KEY}
        # The bundled prices don't cover rerank models; Cohere charges $2 per 1,000 search units
        pricing:
          cohere:rerank-v3.5:
            input_price_per_million: 2000
            output_price_per_million: 0
            unit: requests
          # Cohere's reasoning model for the reasoning tests, at Cohere's list price
          cohere:command-a-reasoning-08-2025:
            input_price_per_million: 2.50
            output_price_per_million: 10.00
        # The API key the tests send
        api_keys:
          haystack-tests:
            secret: $${OTARI_API_KEY}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 2s
      timeout: 5s
      retries: 30
